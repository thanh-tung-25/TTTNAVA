<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập — TTNAVA</title>
  <meta name="description" content="TTNAVA — cùng con luyện tập Toán, Tiếng Việt và Tiếng Anh mỗi ngày.">
  <link rel="icon" href="/assets/images/ttnava-logo.png" type="image/png">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body class="login-body">
  <main class="login-card">
    <a href="/" class="muted">← Về trang giới thiệu</a>
    <img class="login-logo" src="/assets/images/ttnava-logo.png" alt="Logo TTNAVA" width="144" height="144">
    <h1>TTNAVA</h1>
    <p class="muted" style="margin-bottom:1.2rem">Cùng con học giỏi mỗi ngày</p>

    <form id="login-form" novalidate>
      <div class="form-error hidden" id="login-error" role="alert"></div>
      <div class="field">
        <label for="username">Tên đăng nhập</label>
        <input class="input" id="username" name="username" type="text" autocomplete="username"
               placeholder="Ví dụ: be_lan" maxlength="20" required>
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <div class="password-control">
          <input class="input" id="password" name="password" type="password" autocomplete="current-password"
                 placeholder="Nhập mật khẩu" maxlength="72" required>
          <button class="password-toggle" id="password-toggle" type="button" aria-label="Hiện mật khẩu" aria-controls="password" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path id="password-eye-slash" d="M3 3l18 18" hidden/></svg>
          </button>
        </div>
      </div>
      <button class="btn btn-block" id="login-button" type="submit">Vào học thôi! 🚀</button>
    </form>

    <p class="login-note">Chưa có tài khoản? <a href="/pages/register/">Đăng ký bằng Gmail</a></p>
    <p class="login-note">Nếu quên mật khẩu, con hãy nhờ người lớn hoặc quản trị viên hỗ trợ nhé!</p>
  </main>

  <script type="module" src="/assets/js/login.js"></script>
</body>
</html>
