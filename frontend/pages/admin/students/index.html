<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý học sinh — TTNAVA</title>
  <link rel="icon" href="/assets/images/ttnava-logo.png" type="image/png">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
  <link rel="stylesheet" href="/assets/css/admin-students.css">
</head>
<body>
  <header id="app-header"></header>
  <main class="page">
    <div class="page-head">
      <div>
        <p class="eyebrow">Quản trị</p>
        <h1>Học sinh</h1>
        <p>Tạo tài khoản, đặt lại mật khẩu và quản lý trạng thái học sinh.</p>
      </div>
      <button class="btn" id="create-button" type="button">+ Thêm học sinh</button>
    </div>

    <section class="card" aria-labelledby="diamond-leaderboard-title">
      <div class="card-head"><h2 id="diamond-leaderboard-title">Top 5 kim cương · 7 ngày qua</h2></div>
      <div id="admin-diamond-leaderboard"><div class="loading">Đang tải bảng xếp hạng…</div></div>
    </section>
    <section class="card">
      <div id="student-status-tabs" class="tabs hidden" role="tablist" aria-label="Trạng thái tài khoản học sinh" hidden>
        <button id="active-students-tab" class="tab" type="button" role="tab" aria-controls="students-table" aria-selected="true" data-student-status="active">Đang sử dụng</button>
        <button id="deleted-students-tab" class="tab" type="button" role="tab" aria-controls="students-table" aria-selected="false" data-student-status="deleted">Thùng rác</button>
      </div>
      <p id="trash-notice" class="muted" hidden>Tài khoản trong thùng rác không thể đăng nhập. Lịch sử học và quyền học được giữ để khôi phục.</p>
      <div class="filter-bar">
        <select id="program-filter" class="select" aria-label="Chương trình học">
          <option value="">Tất cả học sinh</option>
          <option value="chinese">Tài khoản Tiếng Trung</option>
          <option value="primary">Học sinh lớp 1–5</option>
          <option value="secondary">Học sinh THCS lớp 6–9</option>
          <option value="highschool">Học sinh THPT lớp 10–12</option>
        </select>
        <input class="input" id="search-input" type="search" placeholder="Tìm theo tên hoặc tên đăng nhập…" maxlength="120">
        <button class="btn btn-ghost btn-sm" id="search-button" type="button">Tìm</button>
      </div>
      <div id="students-table"><div class="loading">Đang tải danh sách…</div></div>
      <div class="quiz-actions" style="justify-content:space-between;margin-top:1rem">
        <button class="btn btn-ghost btn-sm" id="prev-page" type="button">← Trang trước</button>
        <span class="muted" id="page-label"></span>
        <button class="btn btn-ghost btn-sm" id="next-page" type="button">Trang sau →</button>
      </div>
    </section>
  </main>
  <dialog id="student-progress-dialog" class="student-progress-dialog" aria-labelledby="student-progress-title"></dialog>
  <script type="module" src="/assets/js/admin-diamond-leaderboard.js"></script>
  <script type="module" src="/assets/js/admin-students.js"></script>
</body>
</html>
