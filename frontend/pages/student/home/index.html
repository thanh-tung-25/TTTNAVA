<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trang chủ — TTNAVA</title>
  <link rel="icon" href="/assets/images/ttnava-logo.png" type="image/png">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
<link rel="stylesheet" href="/assets/css/student-depth.css"></head>
<body data-role="student">
  <header id="app-header"></header>
  <main class="page">
    <section class="hero">
      <img class="hero-mascot" src="/assets/images/mascot-owl.svg" width="172" height="185" alt="">
      <img class="avatar avatar-lg" id="hero-avatar" src="/assets/avatars/meo.svg" alt="">
      <div class="hero-text">
        <p class="eyebrow">Chào con!</p>
        <h1 id="greeting">Chào con, bạn nhỏ!</h1>
        <p id="grade-line">Hôm nay mình cùng học nhé!</p>
        <a class="btn" href="/pages/student/learning/">Đến trang học tập <span aria-hidden="true">→</span></a>
      </div>
    </section>

    <div class="home-bottom">
      <section class="card">
        <div class="card-head"><h2>Kim cương của con</h2><a href="/pages/student/diamonds/">Xem</a></div>
        <div class="grid grid-3">
          <div class="stat"><strong id="diamond-total">0</strong><span>Tổng</span></div>
          <div class="stat"><strong id="diamond-week">0</strong><span>Tuần này</span></div>
          <div class="stat"><strong id="diamond-month">0</strong><span>Tháng này</span></div>
        </div>
      </section>

    <section class="card">
      <div class="card-head"><h2>Hoạt động gần đây</h2><a href="/pages/student/history/">Tất cả</a></div>
      <div id="recent-activity"><div class="loading">Đang tải…</div></div>
    </section>
    </div>
  </main>
  <script type="module" src="/assets/js/home.js"></script>
</body>
</html>
